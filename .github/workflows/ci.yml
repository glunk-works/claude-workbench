name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the claude CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin manifests and skill frontmatter
        run: bash scripts/lint.sh

  # Deliberately its own job, not a step in `lint`: this gate answers a different
  # question (is the plugin still portable?) and needs no toolchain, so it reports a
  # verdict even when the CLI install fails. Job id == check-run name, so this name is
  # what a required-checks list would have to carry.
  coupling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No repo-specific literals in skills/, agents/, bin/, or hooks/
        run: bash scripts/coupling-check.sh

  # Also its own job, for the same reason `coupling` is: it answers a third question --
  # has a specific already-shipped defect come back? -- needs no toolchain, and should
  # report a verdict independently of the other two.
  invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No known-wrong form has returned
        run: bash scripts/invariants-check.sh

  # Also its own job: fixture tests for the plugin's bin/ scripts (see issue #21 --
  # deterministic predicates extracted from skill prose belong in tested scripts).
  # Not yet in {ruleset.required_checks} -- see the PR that added this job.
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cursor-drift.sh fixtures
        run: sh tests/cursor-drift.test.sh
