# Keeps the SHA-pinned GitHub Actions current.
#
# SCOPE, stated because it is easy to assume this covers more than it does: this repo has
# NO package manifests -- no package.json, no requirements.txt, no go.mod. The dependency
# surface is the actions used by `ci.yml` and `release.yml`, plus the base image on the
# `.devcontainer/Dockerfile` FROM line and the one on `scripts/identity/review/Dockerfile`, so
# `github-actions` and `docker` are the only ecosystems that apply. Adding another entry here
# would silently do nothing, which is worse than no entry: it reads as coverage.
#
# NOT COVERED, named deliberately: `release.yml` installs the Claude CLI with
# `npm install -g @anthropic-ai/claude-code@2.1.224`. A version pinned inside a `run:`
# step is invisible to Dependabot -- it reads manifests and workflow `uses:` values, not
# shell commands. **That pin is bumped by hand.** (`ci.yml` installs the same package
# unpinned on purpose; only the release path needs reproducibility, and `release.yml` says
# so at the step.) The Dockerfile pins are bumped by hand too, for their own reason:
# `scripts/loop/Dockerfile`'s `ARG BASE_IMAGE` (a templated `FROM`, and there is no
# `/scripts/loop` entry below) and the two Dockerfiles' (the review image's and the loop's)
# `CLAUDE_VERSION` / `CLAUDE_SHA256` (a download in a `RUN`, not a `FROM`), which
# `tests/review-image.test.sh` holds equal. So is the dev container's `CLAUDE_VERSION` in
# `.devcontainer/Dockerfile`: it is bumped by hand in the Dependabot `FROM` bump PR itself when the
# new base image's `claude` changes, together with the review and loop pins, which the same test
# holds equal to it. No PR check builds the dev image, so the maintainer builds it on the host
# before approving, once the new digest's attestation has been checked (`verify / verify` green,
# or the `gh attestation verify` command in that Dockerfile's header). If the
# `release.yml` hand-bump is ever missed often enough to matter, the fix is a real manifest for
# Dependabot to read, not another entry below.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/" # covers .github/workflows/**
    schedule:
      interval: weekly
      day: monday

    # A newly published action version is a newly published action version -- give it a
    # week before Dependabot proposes it, so a same-day supply-chain compromise or an
    # under-tested release has time to surface before this repo pulls it in. 7 is
    # zizmor's own `dependabot-cooldown` default; keeping it there rather than picking a
    # different number means one less thing to justify diverging from.
    cooldown:
      default-days: 7

    # The actions are pinned by full commit SHA with a trailing `# v5` comment. That is
    # the supply-chain-safe form -- a tag is mutable, a SHA is not -- and Dependabot
    # updates BOTH the SHA and the version comment together, so the pin style survives
    # and stays legible. This is the setup Dependabot handles best, not a workaround.
    #
    # These PRs are reviewed and merged by a human like any other. No auto-merge:
    # an armed auto-merge needs a required code-owner approval (reference/conventions.md), which this
    # repo does not have until its WB-D24 cutover, and an action bump is
    # a change to the code that runs every gate in this repo.

    # One PR for all action bumps rather than one per action. With few actions the noise
    # saving is small; the reason that matters is the PR TITLE. A squash merge makes the
    # title the commit subject on the base branch, so it is the enforced surface
    # (reference/conventions.md, "PR titles use the same grammar", <= 72 chars), and a
    # grouped update keeps it short and stable instead of naming each action.
    groups:
      actions:
        patterns: ["*"]

    # Dependabot's default subject is "Bump X from Y to Z" -- not Conventional Commits,
    # and it would land on the base branch as a non-conforming subject. `ci` is the right
    # type: this is the build surface, nothing a consumer of the plugin ever sees.
    # Produces `ci(deps): ...`.
    commit-message:
      prefix: ci
      include: scope

    labels:
      - dependencies

    open-pull-requests-limit: 3

  # The two base images, one entry and one grouped PR: the dev container's (the FROM line of
  # .devcontainer/Dockerfile) and the review image's (#634; the FROM line of
  # scripts/identity/review/Dockerfile, a literal tag-and-digest line with no ARG before it).
  # One entry, because upstream publishes both images in one release and two entries let
  # Dependabot run between the two pushes and bump one image to the new tag and the other to the
  # old one (#1804 and #1805 did). Both are pinned by tag AND digest. The `# syntax=` frontend
  # pin in the dev container's file is not bumped by Dependabot; the template owns it.
  #
  # Before approving the grouped PR, both checks apply:
  #   - the dev container's: `verify / verify` runs on a bump and checks the image (first-attempt
  #     build, signed provenance). It is not a required check, so a red result blocks no merge.
  #     The maintainer has it green on the PR head, or has run the attestation command in
  #     .devcontainer/Dockerfile's header, and then builds the dev image on the host, since no
  #     PR check builds it.
  #   - the review image's: `verify-base` green on the PR head of a PR that changes nothing under
  #     `.github/workflows/`, else the hand command in scripts/identity/review/Dockerfile's
  #     header passes.
  # When the two FROM lines' tags differ at the PR head, the release may have been caught
  # mid-publish (upstream does not guarantee it publishes both images at one tag). The
  # maintainer checks whether the image at the lower tag has a newer published tag, and does not
  # approve while it has.
  #
  # The cooldown below does not hold for these images: the registry gives Dependabot no
  # publication date for them (Dependabot says so in the PR body), so a bump can arrive the day
  # an image is published, and no delay replaces it. The key stays only because the `zizmor`
  # job's `dependabot-cooldown` audit reports an update entry without one; a clean zizmor
  # result on this entry does not mean a cooldown holds. What the file relies on is the human
  # approval and the checks above.
  - package-ecosystem: docker
    directories:
      - /.devcontainer
      - /scripts/identity/review
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      images:
        patterns: ["603-identity/devcontainer-*"]
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
    open-pull-requests-limit: 3
