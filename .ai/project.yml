# ── identity ─────────────────────────────────────────────────────────────────
repo: glunk-works/claude-workbench
pr_base: main
migration_base: null   # no migration under way (WB-D17, #142 — this key must be present).

# ── the deep record ──────────────────────────────────────────────────────────
# This repo has no separate roadmap-with-status-table — it ships as small,
# single-task PRs (#22, #24-27), and docs/decisions.md's own "Status" section is
# the closest thing to a live status + next-action record. sprints_dir is
# declared per the schema's expectation but stays empty: sprint plans live as
# GitHub milestones (planning.kind below), never as sprints_dir/*/sprint_plan.md.
roadmap: docs/decisions.md
sprints_dir: sprints
threat_model: docs/decisions.md

planning:
  kind: github_milestones   # each sprint is one milestone; #86 is what makes this readable.

decisions:
  log: docs/decisions.md
  prefix: WB-D

backlog:
  kind: github_issues
  repo: null
  path: null
  item_prefix: null

load_bearing_docs:
  - README.md
  - docs/decisions.md
  - CHANGELOG.md
  - plugins/way-of-working/reference/project-schema.md
  - plugins/way-of-working/reference/conventions.md
  - plugins/way-of-working/reference/workflow.md
  - .ai/next-steps.md

# ── what counts as a behavior change ─────────────────────────────────────────
code_paths:
  - plugins/
  - scripts/
  - .github/workflows/
  - .claude-plugin/
  - .devcontainer/

# ── the local green gate ─────────────────────────────────────────────────────
gates:
  green:
    - { run: bash scripts/lint.sh }
    - { run: bash scripts/coupling-check.sh }
    - { run: bash scripts/invariants-check.sh }
    - { run: bash scripts/test-all.sh }

# ── branch protection ────────────────────────────────────────────────────────
# `rulesets` is what resume and pr-checks read; `ruleset` is the legacy key the other
# readers still use, kept in step by hand. Removing the list drops the approval ruleset
# from resume's check.
rulesets:
  - name: main-required-checks
    source: repo
    rule_types: [required_status_checks]
    required_checks: [lint, coupling, invariants, architect-review, tests-1, tests-2, tests-launchers, tests-review-launcher, pr-title]
  - name: protected-integration-branches
    source: repo
    rule_types: [deletion, non_fast_forward, pull_request]
ruleset:
  name: main-required-checks
  rule_types: [required_status_checks]
  required_checks: [lint, coupling, invariants, architect-review, tests-1, tests-2, tests-launchers, tests-review-launcher, pr-title]

# ── the fresh-session review gate ────────────────────────────────────────────
review:
  ci_gate:
    check: architect-review
    header: "**Opus/Architect review (automated)**"
    attestation: "*Fresh-session review: this session did not author the diff.*"
    triggers_on: null   # null means code_paths; a PR touching nothing under code_paths is not gated.

# ── agents ───────────────────────────────────────────────────────────────────
agents:
  enabled: [architect, coder, security-critic, docs-consistency]
  diff_rule: [tests/, .ai/project.yml, .devcontainer/]
models:
  architect: opus
  coder: sonnet
  second_opinion: fable

# ── the sprint-orchestrator loop ─────────────────────────────────────────────
# Plan v9 § 8.4 / § 8.5 / § 8.12. human_only_paths keeps a loop task off CI, the repo gate
# scripts under scripts/, the cursor, this file and the release manifests -- a task
# that could edit them could widen its own authority. plugins/way-of-working/bin/ is
# deliberately NOT listed: it is this repo's product, so the loop must be able to work
# there, under the critic floor (code_paths) and the human merge.
orchestration:
  critics: [architect, security-critic, docs-consistency]
  round_cap: 2
  human_only_paths:
    - .github/
    - .ai/
    - .claude/
    - .claude-plugin/
    - plugins/way-of-working/.claude-plugin/
    - scripts/
    - scripts/identity/
    - .devcontainer/
    - CLAUDE.md
  restrict_updates: null # ruleset removed at this repo's WB-D24 cutover
  loop_identity: "glunk-loop[bot]"

# ── declared identities ──────────────────────────────────────────────────────
# WB-D24 (#378): declared at this repo's cutover; trust is by numeric id, never author_association.
identities:
  maintainer:
    - { login: Seuss27, id: 22668449 }
  # Publish App-mode pushes through bin/api-commit.sh so GitHub signs them (WB-D36, #800).
  dev_app: { login: "glunk-dev[bot]", id: 339840170, commit_route: api }
  reviewer_app: { login: "glunk-review[bot]", id: 339841158 }
  loop_app: { login: "glunk-loop[bot]", id: 338193635 }

# ── coder lanes ──────────────────────────────────────────────────────────────
# #793, #715: the plugin's bin/lane.sh (/way-of-working:lanes) and wow-lane.ps1 put each lane
# at <dir>/<N> in the dev container, and both refuse without this key. Declared so handoff
# records the live lanes and resume reports them.
lanes:
  dir: /tmp/lanes

# #1155: every spec only appends to CHANGELOG.md, so spec-task must mark its Files touched
# bullet with the exact **(append)** form spec-fresh.sh skips; spec-post.sh refuses one without.
append_only:
  - CHANGELOG.md

# ── host tools ───────────────────────────────────────────────────────────────
# #1377, #1435: the tools the local green gate and plugin scripts need on the dev container's PATH.
host_tools:
  - { name: yq, min: "4.54.1", fix: "install mikefarah yq v4.54.1 or newer, or rebuild the dev container" }
  - { name: jq, min: "1.7", fix: "install jq 1.7 or newer, or rebuild the dev container" }
  - { name: git, min: "2.36", fix: "install git 2.36 or newer, or rebuild the dev container" }
  - { name: gh, min: "2.0", fix: "install the GitHub CLI 2.0 or newer, or rebuild the dev container" }
  - { name: claude, min: "2.0", fix: "install Claude Code 2.0 or newer, or rebuild the dev container" }

# ── deployment environments ──────────────────────────────────────────────────
# #1488: the environments scripts/identity/wow-readback compares with the repo's live ones. `release` is
# the main-only, human-reviewed environment .github/workflows/release.yml deploys through; the reviewer
# is the declared maintainer. An environment not listed here is not judged.
environments:
  - { name: release, reviewers: [{ type: User, id: 22668449 }], branch_policy: custom, branches: [main], admins_can_bypass: false }
